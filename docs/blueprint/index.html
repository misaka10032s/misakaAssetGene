<script>
bpLoadVendoredJs("bp-marked-src");
</script>
<script>
(function () {
  "use strict";
  var STAMP = JSON.parse(document.getElementById("bp-stamp").textContent);
  var DATA = JSON.parse(document.getElementById("bp-data").textContent);
  // path -> markdown content, for every unique docs/superpowers/** file any
  // entry's 'superpowers:' field links to (batch3 feature 1/2).
  var SUPERPOWERS_DOCS = JSON.parse(document.getElementById("bp-superpowers-docs").textContent);

  // Deterministic "now" reference — see header comment. Never use Date.now().
  var NOW = new Date(STAMP.built_at);

  // marked custom renderer: ```mermaid fences become <pre class="mermaid">
  // holding the RAW fence text (not marked's default <code> highlighting) —
  // mermaid.run()/render() reads this element's text as the diagram source.
  // Registered unconditionally (cheap, a few lines); mermaid.min.js itself
  // is only embedded when at least one entry actually needs it (see
  // blueprint-build.py _any_entry_has_mermaid / SPEC §5.2 size discipline).
  if (typeof marked !== "undefined" && marked.use) {
    marked.use({
      renderer: {
        code: function (token) {
          var codeText = (token && typeof token === "object") ? token.text : arguments[0];
          var lang = (token && typeof token === "object") ? token.lang : arguments[1];
          if (lang === "mermaid") {
            return '<pre class="mermaid">' + escapeHtml(codeText) + '</pre>';
          }
          var langAttr = lang ? ' class="language-' + escapeHtml(lang) + '"' : "";
          return "<pre><code" + langAttr + ">" + escapeHtml(codeText) + "</code></pre>";
        }
      }
    });
  }

  // Render every unrendered mermaid code block in the detail pane. A syntax
  // error must degrade gracefully: mermaid.render() rejects its promise on
  // parse failure and we deliberately do NOT touch the element on failure,
  // so the raw fenced text stays visible as a plain code block — never a
  // blank pane (SPEC §5.2).
  function renderMermaidBlocks(root) {
    if (typeof mermaid === "undefined") return;
    root = root || document.getElementById("bp-detail");
    var blocks = root.querySelectorAll("pre.mermaid:not(.bp-mermaid-rendered)");
    Array.prototype.forEach.call(blocks, function (el, idx) {
      var src = el.textContent;
      var id = "bp-mmd-" + Date.now() + "-" + idx;
      try {
        mermaid.render(id, src).then(function (result) {
          el.innerHTML = result.svg;
          el.classList.add("bp-mermaid-rendered");
        }).catch(function () {
          // leave the raw fenced text visible — graceful degrade, not blank
        });
      } catch (e) {
        // leave the raw fenced text visible — graceful degrade, not blank
      }
    });
  }

  var STATUS_BADGE_CLASS = {
    "待評估": "bp-status-eval-pending",
    "評估中": "bp-status-eval-progress",
    "待判斷": "bp-status-decision",
    "待做": "bp-status-todo",
    "開發中": "bp-status-in-dev",
    "已完成": "bp-status-done",
    "已測試": "bp-status-tested",
    "已部署": "bp-status-deployed",
    "廢棄": "bp-status-deprecated",
    "擱置": "bp-status-shelved"
  };

  function renderBanner() {
    var el = document.getElementById("bp-banner");
    el.innerHTML =
      "<span class=\"bp-project-title\">" + escapeHtml(STAMP.project_title || "Blueprint") + " — Blueprint</span>" +
      "<span>build stamp — <b>built_at:</b> " + escapeHtml(STAMP.built_at) + "</span>" +
      "<span><b>commit:</b> " + escapeHtml(STAMP.git_short_sha) + "</span>" +
      "<span><b>entries_hash:</b> " + escapeHtml((STAMP.entries_hash || "").slice(0, 12)) + "…</span>" +
      "<span><b>entries:</b> " + DATA.length + "</span>";
  }

  function escapeHtml(s) {
    if (s == null) return "";
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function populateFilterOptions() {
    var statusSel = document.getElementById("bp-filter-status");
    var systemSel = document.getElementById("bp-filter-system");
    var tagSel = document.getElementById("bp-filter-tag");
    var statuses = uniqueSorted(DATA.map(function (e) { return e.status; }));
    var systems = uniqueSorted(DATA.map(function (e) { return e.system; }));
    var tags = uniqueSorted(DATA.reduce(function (acc, e) { return acc.concat(e.tags || []); }, []));
    statuses.forEach(function (s) { addOption(statusSel, s, s); });
    systems.forEach(function (s) { addOption(systemSel, s, s); });
    tags.forEach(function (t) { addOption(tagSel, t, t); });
  }

  function addOption(sel, value, label) {
    var opt = document.createElement("option");
    opt.value = value;
    opt.textContent = label;
    sel.appendChild(opt);
  }

  function uniqueSorted(arr) {
    var set = {};
    arr.forEach(function (v) { if (v) set[v] = true; });
    return Object.keys(set).sort();
  }

  function statusClass(status) {
    return STATUS_BADGE_CLASS[status] || "bp-badge-default";
  }

  function renderStats() {
    var counts = {};
    DATA.forEach(function (e) { counts[e.status] = (counts[e.status] || 0) + 1; });
    var el = document.getElementById("bp-stats");
    el.innerHTML = Object.keys(counts).sort().map(function (status) {
      return '<span class="bp-stat-chip ' + statusClass(status) + '">' + escapeHtml(status) + ' × ' + counts[status] + '</span>';
    }).join("");
  }

  function withinLast30Days(dateStr) {
    if (!dateStr || dateStr === "unknown") return false;
    var d = new Date(dateStr);
    if (isNaN(d.getTime())) return false;
    var diffMs = NOW - d;
    return diffMs >= 0 && diffMs <= 30 * 24 * 60 * 60 * 1000;
  }

  function renderRecent() {
    var changes = [];
    DATA.forEach(function (e) {
      (e.revisions || []).forEach(function (r) {
        if (withinLast30Days(r.date)) changes.push({ date: r.date, id: e.id, title: e.title, summary: r.summary });
      });
      (e.tests || []).forEach(function (t) {
        if (withinLast30Days(t.date)) changes.push({ date: t.date, id: e.id, title: e.title, summary: "測試: " + t.result });
      });
    });
    changes.sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    var listEl = document.getElementById("bp-recent-list");
    if (changes.length === 0) {
      listEl.innerHTML = "<li>(近 30 天無變動)</li>";
      return;
    }
    listEl.innerHTML = changes.map(function (c) {
      return "<li><a class=\"bp-dep-link\" data-goto=\"" + escapeHtml(c.id) + "\">" +
        escapeHtml(c.date) + " · " + escapeHtml(c.title) + "</a> — " + escapeHtml(c.summary) + "</li>";
    }).join("");
  }

  var sortKey = "id";
  var sortDir = 1;

  function currentFilters() {
    return {
      q: document.getElementById("bp-search").value.trim().toLowerCase(),
      status: document.getElementById("bp-filter-status").value,
      system: document.getElementById("bp-filter-system").value,
      tag: document.getElementById("bp-filter-tag").value
    };
  }

  function filteredData() {
    var f = currentFilters();
    return DATA.filter(function (e) {
      if (f.status && e.status !== f.status) return false;
      if (f.system && e.system !== f.system) return false;
      if (f.tag && (e.tags || []).indexOf(f.tag) === -1) return false;
      if (f.q) {
        var hay = [e.id, e.title, e.body, e.request_verbatim].join(" ").toLowerCase();
        if (hay.indexOf(f.q) === -1) return false;
      }
      return true;
    }).sort(function (a, b) {
      var av = a[sortKey] || "";
      var bv = b[sortKey] || "";
      if (av < bv) return -1 * sortDir;
      if (av > bv) return 1 * sortDir;
      return 0;
    });
  }

  function badgeHtml(status) {
    return '<span class="bp-badge ' + statusClass(status) + '">' + escapeHtml(status) + '</span>';
  }

  function updateSortIndicators() {
    Array.prototype.forEach.call(document.querySelectorAll("#bp-list th[data-key]"), function (th) {
      var key = th.getAttribute("data-key");
      var arrow = th.querySelector(".bp-sort-arrow");
      if (arrow) arrow.remove();
      if (key === sortKey) {
        var span = document.createElement("span");
        span.className = "bp-sort-arrow";
        span.textContent = sortDir === 1 ? "▲" : "▼";
        th.appendChild(span);
      }
    });
  }

  var activeId = null;
  // Per-row expand state (batch2): a plain id->true map, independent of
  // activeId/selection, so multiple rows may be expanded at once and the
  // state survives re-renders (filter/sort/select all call renderList()).
  var expandedIds = {};
  // Batch3 feature 5 — 廢棄/擱置 section starts collapsed.
  var deprecatedExpanded = false;

  function isDeprecatedStatus(status) {
    return status === "廢棄" || status === "擱置";
  }

  // D15 — title-first row markup: the feature TITLE is the primary,
  // larger/bolder column (first text read); the BP id is demoted to small
  // muted text in its own column right after. Column order is swapped to
  // match the thead swap above; both stay independently sortable.
  function rowHtml(e) {
    var isExpanded = expandedIds[e.id] === true;
    return '<tr class="bp-row' + (e.id === activeId ? ' active' : '') + (isExpanded ? ' bp-row-expanded' : '') + '" data-id="' + escapeHtml(e.id) + '">' +
      "<td class=\"bp-col-title\"><span class=\"bp-expand-indicator\">▸</span>" + escapeHtml(e.title) + "</td>" +
      "<td class=\"bp-col-id\">" + escapeHtml(e.id) + "</td>" +
      "<td>" + escapeHtml(e.system) + "</td>" +
      "<td>" + badgeHtml(e.status) + "</td>" +
      "<td>" + escapeHtml(e.decided_date) + "</td>" +
      "<td>" + escapeHtml(e.done_date) + "</td>" +
      "<td>" + (e.latest_test_result ? '<span class="' + (e.latest_test_result.startsWith("PASS") ? "bp-result-pass" : "bp-result-fail") + '">' + escapeHtml(e.latest_test_result) + '</span>' : "") + "</td>" +
      "<td>" + escapeHtml(e.last_revision_date) + "</td>" +
      "</tr>";
  }

  function wireRowClicks(bodyEl) {
    Array.prototype.forEach.call(bodyEl.querySelectorAll(".bp-row"), function (tr) {
      tr.addEventListener("click", function () {
        var id = tr.getAttribute("data-id");
        // Selecting/showing detail is unconditional (kept); expand toggles
        // independently on every click of the SAME row (per-row, on/off).
        if (expandedIds[id]) { delete expandedIds[id]; } else { expandedIds[id] = true; }
        showDetail(id);
      });
    });
  }

  function renderList() {
    var rows = filteredData();
    // Batch3 feature 5 — 廢棄/擱置 entries never interleave with active
    // entries: they are segregated into their own collapsed section below
    // the main table. Filters/search still apply to BOTH groups (computed
    // from the same filteredData() call); only visibility of the deprecated
    // table depends on deprecatedExpanded.
    var active = rows.filter(function (e) { return !isDeprecatedStatus(e.status); });
    var deprecated = rows.filter(function (e) { return isDeprecatedStatus(e.status); });

    var body = document.getElementById("bp-list-body");
    body.innerHTML = active.map(rowHtml).join("");
    wireRowClicks(body);

    var depBody = document.getElementById("bp-deprecated-list-body");
    depBody.innerHTML = deprecated.map(rowHtml).join("");
    wireRowClicks(depBody);

    document.getElementById("bp-deprecated-count").textContent = String(deprecated.length);
    document.getElementById("bp-deprecated-list").hidden = !deprecatedExpanded;
    document.getElementById("bp-deprecated-header").classList.toggle("bp-deprecated-expanded", deprecatedExpanded);
    var indicator = document.getElementById("bp-deprecated-indicator");
    indicator.textContent = deprecatedExpanded ? "▾" : "▸";

    updateSortIndicators();
  }

  function findEntry(id) {
    for (var i = 0; i < DATA.length; i++) if (DATA[i].id === id) return DATA[i];
    return null;
  }

  function renderTestsTable(tests) {
    if (!tests || tests.length === 0) return "<p>(無測試紀錄)</p>";
    var rows = tests.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    return "<table><thead><tr><th>日期</th><th>目標</th><th>動作</th><th>預期</th><th>結果</th><th>證據</th><th>執行者</th></tr></thead><tbody>" +
      rows.map(function (t) {
        var resultCls = (t.result || "").startsWith("PASS") ? "bp-result-pass" : "bp-result-fail";
        return "<tr><td>" + escapeHtml(t.date) + "</td><td>" + escapeHtml(t.target) + "</td><td>" +
          escapeHtml(t.action) + "</td><td>" + escapeHtml(t.expected) + "</td><td class=\"" + resultCls + "\">" +
          escapeHtml(t.result) + "</td><td>" + (t.evidence ? escapeHtml(t.evidence) : "") + "</td><td>" +
          (t.executor ? escapeHtml(t.executor) : "") + "</td></tr>";
      }).join("") + "</tbody></table>";
  }

  // D15: qa_log ids are ENTRY-SCOPED ("qa-<entryId>-<n>", not the historical
  // bare "qa-<n>") because the 總規格 view puts every entry's qa_log block in
  // the DOM simultaneously — an unscoped id would collide across entries.
  // List mode only ever shows ONE entry's detail at a time, so this is a
  // harmless (still-unique) scheme there too. See interceptHashLinks() for
  // how a raw body link '#qa-N' resolves to the correct scoped id.
  function renderQaLog(qaLog, entryId) {
    if (!qaLog || qaLog.length === 0) return "<p>(無 Q&amp;A 紀錄)</p>";
    return "<ul>" + qaLog.map(function (qa, idx) {
      return "<li id=\"qa-" + escapeHtml(entryId) + "-" + (idx + 1) + "\"><b>" + escapeHtml(qa.date) + "</b> — Q: " + escapeHtml(qa.q) + " / A: " + escapeHtml(qa.a) + "</li>";
    }).join("") + "</ul>";
  }

  // Batch3 feature 1 — 相關文件(superpowers) link list for the entry detail.
  function renderSuperpowersLinks(links) {
    if (!links || links.length === 0) return "";
    return "<div class=\"bp-section-title\">相關文件(superpowers)</div>" +
      "<ul class=\"bp-superpowers-list\">" + links.map(function (l) {
        return "<li><a class=\"bp-superpowers-link\" data-sp-path=\"" + escapeHtml(l.path) +
          "\" data-sp-label=\"" + escapeHtml(l.label || l.path) + "\">" +
          escapeHtml(l.label || l.path) + " (" + escapeHtml(l.path) + ")</a></li>";
      }).join("") + "</ul>";
  }

  // Batch3 feature 2 — embedded-doc viewer modal (marked + conditional mermaid).
  function openSuperpowersModal(path, label) {
    var content = SUPERPOWERS_DOCS[path];
    var bodyHtml;
    if (content == null) {
      bodyHtml = "<p>(找不到文件內容: " + escapeHtml(path) + ")</p>";
    } else {
      bodyHtml = (typeof marked !== "undefined")
        ? (marked.parse ? marked.parse(content) : marked(content))
        : "<pre>" + escapeHtml(content) + "</pre>";
    }
    document.getElementById("bp-modal-title").textContent = (label || path) + " — " + path;
    var bodyEl = document.getElementById("bp-modal-body");
    bodyEl.innerHTML = bodyHtml;
    document.getElementById("bp-modal-backdrop").hidden = false;
    renderMermaidBlocks(bodyEl);
  }

  function closeSuperpowersModal() {
    document.getElementById("bp-modal-backdrop").hidden = true;
  }

  // Batch3 feature 3 — scroll to + briefly highlight an in-page element
  // (qa_log anchors from body links, and 歷程 timeline qa entries).
  function scrollAndHighlight(id) {
    var target = document.getElementById(id);
    if (!target) return;
    target.scrollIntoView({ behavior: "smooth", block: "center" });
    target.classList.remove("bp-highlight");
    // force reflow so the animation restarts even if the same target was
    // just highlighted a moment ago
    void target.offsetWidth;
    target.classList.add("bp-highlight");
  }

  // Intercept in-page '#id' anchor clicks inside a rendered body (marked
  // output legally emits real <a href="#qa-1"> for [text](#qa-1) links) so
  // they scroll+highlight instead of performing a real page navigation.
  // D15: entry bodies always author the raw, unscoped form '#qa-N' — the
  // actual qa_log <li> id is entry-scoped ("qa-<entryId>-N", see
  // renderQaLog/_fullspec_qa_html) so multiple entries' qa_log blocks can
  // coexist in the DOM (總規格 view) without id collisions. entryId tells
  // this interceptor which entry's scoped id a raw '#qa-N' link resolves
  // to; a hash that isn't the qa-N shape falls back to literal lookup.
  function interceptHashLinks(root, entryId) {
    Array.prototype.forEach.call(root.querySelectorAll('a[href^="#"]'), function (a) {
      a.addEventListener("click", function (ev) {
        ev.preventDefault();
        var raw = a.getAttribute("href").slice(1);
        var m = /^qa-(\d+)$/.exec(raw);
        scrollAndHighlight(m ? ("qa-" + entryId + "-" + m[1]) : raw);
      });
    });
  }

  // Batch3 feature 4 — 歷程: one merged, ascending timeline of revisions +
  // qa_log + tests + decided/done milestone dates. Undated items (should
  // never exist per the date-integrity rule) sort last with a visible ⚠.
  // Split into buildTimelineItems()/formatTimelineItems() (D16) so the
  // fullspec select-only view can check the ITEM COUNT (to omit an empty
  // 歷程 collapsible entirely, zero-count hidden) without re-deriving the
  // same collection/sort logic a second time.
  function buildTimelineItems(e) {
    var items = [];
    (e.revisions || []).forEach(function (r) {
      items.push({ date: r.date, kind: "修訂", summary: r.summary || "" });
    });
    (e.qa_log || []).forEach(function (qa, idx) {
      items.push({ date: qa.date, kind: "Q&A", summary: "Q: " + (qa.q || "") + " / A: " + (qa.a || ""), anchor: "qa-" + e.id + "-" + (idx + 1) });
    });
    (e.tests || []).forEach(function (t) {
      items.push({ date: t.date, kind: "測試", summary: (t.target || "") + " — " + (t.result || "") });
    });
    if (e.decided_date) items.push({ date: e.decided_date, kind: "里程碑", summary: "決策日" });
    if (e.done_date) items.push({ date: e.done_date, kind: "里程碑", summary: "完成日" });

    items.sort(function (a, b) {
      if (!a.date && !b.date) return 0;
      if (!a.date) return 1;
      if (!b.date) return -1;
      if (a.date < b.date) return -1;
      if (a.date > b.date) return 1;
      return 0;
    });
    return items;
  }

  function formatTimelineItems(items) {
    if (items.length === 0) return "<p>(無歷程紀錄)</p>";
    return "<ul class=\"bp-timeline\">" + items.map(function (it) {
      var dateLabel = it.date
        ? escapeHtml(it.date)
        : "<span class=\"bp-timeline-undated\">⚠ 無日期</span>";
      var anchorAttr = it.anchor ? " data-goto-qa=\"" + escapeHtml(it.anchor) + "\"" : "";
      return "<li" + anchorAttr + "><span class=\"bp-timeline-date\">" + dateLabel + "</span>" +
        "<span class=\"bp-timeline-kind\">" + escapeHtml(it.kind) + "</span>" +
        escapeHtml(it.summary) + "</li>";
    }).join("") + "</ul>";
  }

  function renderTimeline(e) {
    return formatTimelineItems(buildTimelineItems(e));
  }

  function renderDepLinks(ids) {
    if (!ids || ids.length === 0) return "(無)";
    return ids.map(function (id) {
      var e = findEntry(id);
      var label = e ? (id + " " + e.title) : (id + " (缺失)");
      return "<a class=\"bp-dep-link\" data-goto=\"" + escapeHtml(id) + "\">" + escapeHtml(label) + "</a>";
    }).join(", ");
  }

  function showDetail(id) {
    var e = findEntry(id);
    if (!e) return;
    activeId = id;
    renderList();
    var el = document.getElementById("bp-detail");
    el.classList.remove("empty");

    var bodyHtml = (typeof marked !== "undefined")
      ? (marked.parse ? marked.parse(e.body || "") : marked(e.body || ""))
      : "<pre>" + escapeHtml(e.body || "") + "</pre>";

    el.innerHTML =
      "<h1>" + escapeHtml(e.id) + " — " + escapeHtml(e.title) + " " + badgeHtml(e.status) + "</h1>" +
      "<p><b>系統:</b> " + escapeHtml(e.system) + " &nbsp; <b>標籤:</b> " + escapeHtml((e.tags || []).join(", ")) + "</p>" +
      "<p><b>使用者原話:</b> " + escapeHtml(e.request_verbatim) + "</p>" +
      "<p><b>決策日:</b> " + escapeHtml(e.decided_date) + " &nbsp; <b>完成日:</b> " + escapeHtml(e.done_date) + " &nbsp; <b>部署狀態:</b> " + escapeHtml(e.deploy_status) + "</p>" +
      (e.origin ? "<p><b>來源:</b> " + escapeHtml(e.origin) + "</p>" : "") +
      (e.deprecated ? "<p style=\"color:var(--fail)\"><b>已廢棄:</b> " + escapeHtml(e.deprecated.reason) + (e.deprecated.superseded_by ? (" → " + escapeHtml(e.deprecated.superseded_by)) : "") + "</p>" : "") +
      "<div class=\"bp-section-title\">設計本文</div>" + bodyHtml +
      renderSuperpowersLinks(e.superpowers) +
      "<div class=\"bp-section-title\">依賴</div>" +
      "<p><b>依賴:</b> " + renderDepLinks(e.depends_on) + "</p>" +
      "<p><b>被誰依賴:</b> " + renderDepLinks(e.reverse_deps) + "</p>" +
      "<div class=\"bp-section-title\">測試紀錄</div>" + renderTestsTable(e.tests) +
      "<div class=\"bp-section-title\">Q&amp;A 紀錄</div>" + renderQaLog(e.qa_log, e.id) +
      "<div class=\"bp-section-title\">歷程</div>" + renderTimeline(e);

    Array.prototype.forEach.call(el.querySelectorAll("[data-goto]"), function (a) {
      a.addEventListener("click", function () { showDetail(a.getAttribute("data-goto")); });
    });

    // Batch3 feature 1/2 — clicking a superpowers link opens the embedded
    // doc-viewer modal instead of navigating.
    Array.prototype.forEach.call(el.querySelectorAll(".bp-superpowers-link"), function (a) {
      a.addEventListener("click", function () {
        openSuperpowersModal(a.getAttribute("data-sp-path"), a.getAttribute("data-sp-label"));
      });
    });

    // Batch3 feature 4 — clicking a 歷程 Q&A item scrolls to + highlights
    // the matching qa_log record.
    Array.prototype.forEach.call(el.querySelectorAll("[data-goto-qa]"), function (li) {
      li.addEventListener("click", function () { scrollAndHighlight(li.getAttribute("data-goto-qa")); });
    });

    // Batch3 feature 3 — body markdown links like [→ 討論](#qa-1) scroll to
    // + highlight the qa_log record instead of navigating the page away.
    interceptHashLinks(el, e.id);

    renderMermaidBlocks(el);
  }

  // Dual drag-resize splitters (batch2). setPointerCapture keeps a fast
  // drag locked to the handle even if the pointer briefly leaves it
  // mid-move; size updates live while dragging; sizes persist to
  // localStorage so a reload keeps the user's chosen layout; double-click
  // resets to the built-in default.
  function initSplitter(handle, opts) {
    function clamp(size) {
      var max = typeof opts.max === "function" ? opts.max() : opts.max;
      return Math.max(opts.min, Math.min(max, size));
    }
    function apply(size) {
      size = clamp(size);
      opts.setSize(size);
      return size;
    }

    var stored = parseFloat(localStorage.getItem(opts.storageKey));
    apply(isNaN(stored) ? opts.defaultSize : stored);

    handle.addEventListener("pointerdown", function (ev) {
      handle.setPointerCapture(ev.pointerId);
      handle.classList.add("bp-splitter-dragging");
      document.body.classList.add("bp-resizing");
      var startPos = opts.axis === "x" ? ev.clientX : ev.clientY;
      var startSize = opts.getSize();

      function onMove(mv) {
        var pos = opts.axis === "x" ? mv.clientX : mv.clientY;
        var size = apply(startSize + (pos - startPos));
        localStorage.setItem(opts.storageKey, String(size));
      }
      function onUp() {
        handle.releasePointerCapture(ev.pointerId);
        handle.classList.remove("bp-splitter-dragging");
        document.body.classList.remove("bp-resizing");
        handle.removeEventListener("pointermove", onMove);
        handle.removeEventListener("pointerup", onUp);
      }
      handle.addEventListener("pointermove", onMove);
      handle.addEventListener("pointerup", onUp);
    });

    handle.addEventListener("dblclick", function () {
      apply(opts.defaultSize);
      localStorage.setItem(opts.storageKey, String(opts.defaultSize));
    });
  }

  function initSplitters() {
    initSplitter(document.getElementById("bp-splitter-v"), {
      axis: "x",
      storageKey: "bp-list-width",
      min: 280,
      max: function () { return window.innerWidth * 0.7; },
      defaultSize: 420,
      getSize: function () { return document.getElementById("bp-sidebar").getBoundingClientRect().width; },
      setSize: function (size) { document.getElementById("bp-sidebar").style.width = size + "px"; }
    });
    initSplitter(document.getElementById("bp-splitter-h"), {
      axis: "y",
      storageKey: "bp-recent-height",
      min: 80,
      max: function () { return window.innerHeight * 0.6; },
      defaultSize: 120,
      getSize: function () { return document.getElementById("bp-recent").getBoundingClientRect().height; },
      setSize: function (size) { document.getElementById("bp-recent").style.height = size + "px"; }
    });
  }

  // --------------------------------------------------------------------
  // D15 — mode toggle (總規格 is the DEFAULT view on load; markup already
  // ships #bp-fullspec visible / #bp-layout hidden, this just keeps the
  // button active-state + hidden-attrs in sync on every switch).
  // --------------------------------------------------------------------
  function setMode(mode) {
    var isFull = mode === "full";
    document.getElementById("bp-fullspec").hidden = !isFull;
    document.getElementById("bp-layout").hidden = isFull;
    document.getElementById("bp-mode-full").classList.toggle("active", isFull);
    document.getElementById("bp-mode-list").classList.toggle("active", !isFull);
  }
  document.getElementById("bp-mode-full").addEventListener("click", function () { setMode("full"); });
  document.getElementById("bp-mode-list").addEventListener("click", function () { setMode("list"); });

  // --------------------------------------------------------------------
  // D16 — 總規格 select-only view. TOC + content are both built entirely
  // client-side from DATA/STAMP (no server-rendered fullspec HTML at all).
  // Clicking a TOC item shows ONLY that selection — a single feature, or a
  // system's bounded feature list — swapped in instantly, never a scroll
  // through a giant concatenated document (user verdict, see header note).
  // --------------------------------------------------------------------

  // Sentinel system key for the segregated 廢棄/擱置 TOC group + chapter
  // selection — distinct from any real 'system' string an entry can carry.
  var DEPRECATED_CHAPTER_KEY = "__deprecated__";

  // Collapsed-by-default 討論記錄/測試記錄/歷程 block wrapper (D16 JS mirror
  // of the retired server-side _collapsible_block_html()) — the header's
  // click/keydown toggle is wired once via event delegation in
  // initFullSpec(), not per-block here.
  function collapsibleBlockHtml(label, contentHtml, blockId) {
    return '<div class="bp-collapsible" id="' + escapeHtml(blockId) + '">' +
      '<div class="bp-collapsible-header" role="button" tabindex="0">' +
      '<span class="bp-expand-indicator">▸</span>' + escapeHtml(label) + '</div>' +
      '<div class="bp-collapsible-body" hidden>' + contentHtml + '</div></div>';
  }

  function renderFullspecDatesLine(e) {
    var parts = [];
    if (e.decided_date) parts.push("決策 " + e.decided_date);
    if (e.done_date) parts.push("完成 " + e.done_date);
    if (e.latest_test_date) parts.push("測試 " + e.latest_test_date + " (" + e.latest_test_result + ")");
    return parts.join(" · ");
  }

  // One feature's full select-only section: title + status badge + small
  // dates/id line, 設計本文 (filled in by selectFullspec() after insertion,
  // same marked/mermaid pipeline as list mode), 相關文件(superpowers), and
  // the 討論記錄(N)/測試記錄(N)/歷程 collapsibles — a block is OMITTED
  // entirely (not shown as "(0)") when its count is zero.
  function renderFullspecFeatureSection(e, muted) {
    var collapsibles = "";
    if (e.qa_log && e.qa_log.length) {
      collapsibles += collapsibleBlockHtml(
        "討論記錄 (" + e.qa_log.length + ")", renderQaLog(e.qa_log, e.id), "bp-fs-qa-" + e.id
      );
    }
    if (e.tests && e.tests.length) {
      collapsibles += collapsibleBlockHtml(
        "測試記錄 (" + e.tests.length + ")", renderTestsTable(e.tests), "bp-fs-tests-" + e.id
      );
    }
    var timelineItems = buildTimelineItems(e);
    if (timelineItems.length) {
      collapsibles += collapsibleBlockHtml("歷程", formatTimelineItems(timelineItems), "bp-fs-timeline-" + e.id);
    }

    var deprecatedHtml = "";
    if (e.deprecated) {
      var reason = escapeHtml(e.deprecated.reason || "");
      var supersededHtml = e.deprecated.superseded_by ? (" → " + escapeHtml(e.deprecated.superseded_by)) : "";
      deprecatedHtml = "<p class=\"bp-fullspec-deprecated-note\"><b>已廢棄:</b> " + reason + supersededHtml + "</p>";
    }

    var mutedClass = muted ? " bp-fullspec-muted" : "";

    return '<section class="bp-fullspec-feature' + mutedClass + '" id="bp-fullspec-section-' + escapeHtml(e.id) + '" data-entry-id="' + escapeHtml(e.id) + '">' +
      '<div class="bp-fullspec-feature-head">' +
      '<h3 class="bp-fullspec-feature-title">' + escapeHtml(e.title) + '</h3>' +
      '<div class="bp-fullspec-feature-meta">' + badgeHtml(e.status) +
      '<span class="bp-fullspec-dates">' + escapeHtml(renderFullspecDatesLine(e)) + '</span>' +
      '</div></div>' +
      '<div class="bp-fullspec-id">' + escapeHtml(e.id) + '</div>' +
      deprecatedHtml +
      '<div class="bp-section-title">設計本文</div>' +
      '<div class="bp-fullspec-body" data-entry-id="' + escapeHtml(e.id) + '"></div>' +
      renderSuperpowersLinks(e.superpowers) +
      collapsibles +
      '</section>';
  }

  // Build the left TOC: active systems in STAMP.systems_order (config.yml
  // 'systems:' order, computed at build time by get_systems_order()), each
  // listing its feature titles; 廢棄/擱置 entries are grouped into one
  // final, separately-styled TOC group, never interleaved with active ones.
  // D17: a chapter (system) big-title is a pure expand/collapse toggle for
  // its own nested feature <ul> — it never renders content — so every
  // chapter link ships expanded (aria-expanded="true") with a caret glyph;
  // only feature links carry a data-id that selectFullspec() renders.
  function buildFullspecToc() {
    var systemsOrder = STAMP.systems_order || [];
    var activeChapters = systemsOrder.map(function (sys) {
      return { system: sys, entries: DATA.filter(function (e) { return e.system === sys && !isDeprecatedStatus(e.status); }) };
    }).filter(function (ch) { return ch.entries.length > 0; });

    var deprecatedEntries = DATA.filter(function (e) { return isDeprecatedStatus(e.status); });

    function chapterHtml(system, label, extraClass, items) {
      return '<li class="bp-toc-chapter' + (extraClass ? " " + extraClass : "") + '">' +
        '<a class="bp-toc-link bp-toc-chapter-link" data-mode="chapter" data-system="' + escapeHtml(system) +
        '" aria-expanded="true"><span class="bp-toc-caret" aria-hidden="true">▾</span>' +
        escapeHtml(label) + '</a><ul>' + items + '</ul></li>';
    }

    var html = "";
    activeChapters.forEach(function (ch) {
      var items = ch.entries.map(function (e) {
        return '<li><a class="bp-toc-link" data-mode="feature" data-id="' + escapeHtml(e.id) + '">' + escapeHtml(e.title) + '</a></li>';
      }).join("");
      html += chapterHtml(ch.system, ch.system, "", items);
    });
    if (deprecatedEntries.length) {
      var depItems = deprecatedEntries.map(function (e) {
        return '<li><a class="bp-toc-link" data-mode="feature" data-id="' + escapeHtml(e.id) + '">' + escapeHtml(e.title) + '</a></li>';
      }).join("");
      html += chapterHtml(DEPRECATED_CHAPTER_KEY, "廢棄/擱置", "bp-toc-chapter-deprecated", depItems);
    }

    document.getElementById("bp-fullspec-toc").innerHTML = '<ul class="bp-toc">' + html + '</ul>';
    return { activeChapters: activeChapters, deprecatedEntries: deprecatedEntries };
  }

  // A chapter (system) big-title click ONLY expands/collapses its own
  // nested feature <ul> — it never touches #bp-fullspec-content. The <ul>
  // is the link's next sibling in the markup buildFullspecToc() emits.
  function toggleTocChapter(link) {
    var expanded = link.getAttribute("aria-expanded") === "true";
    var next = !expanded;
    link.setAttribute("aria-expanded", String(next));
    var caret = link.querySelector(".bp-toc-caret");
    if (caret) caret.textContent = next ? "▾" : "▸";
    var list = link.nextElementSibling;
    if (list) {
      if (next) { list.removeAttribute("hidden"); } else { list.setAttribute("hidden", ""); }
    }
  }

  // Show ONLY the selected feature, replacing the ENTIRE content pane in
  // one shot (no scrollIntoView, no partial content left over from the
  // previous selection). D17: chapters never render — this only ever
  // handles a single feature id.
  function selectFullspec(key) {
    var contentRoot = document.getElementById("bp-fullspec-content");
    var e = findEntry(key);
    if (!e) return;
    var html = renderFullspecFeatureSection(e, isDeprecatedStatus(e.status));

    contentRoot.innerHTML = html;
    contentRoot.scrollTop = 0;

    // Fill each feature's '.bp-fullspec-body' placeholder with the SAME
    // marked/mermaid rendering list mode's showDetail() uses.
    Array.prototype.forEach.call(contentRoot.querySelectorAll(".bp-fullspec-body[data-entry-id]"), function (div) {
      var id = div.getAttribute("data-entry-id");
      var entry = findEntry(id);
      if (!entry) return;
      var bodyHtml = (typeof marked !== "undefined")
        ? (marked.parse ? marked.parse(entry.body || "") : marked(entry.body || ""))
        : "<pre>" + escapeHtml(entry.body || "") + "</pre>";
      div.innerHTML = bodyHtml;
      interceptHashLinks(div, id);
    });
    renderMermaidBlocks(contentRoot);

    // TOC highlight: exactly the clicked feature link, nothing else
    // (compare via dataset, not a constructed CSS attribute selector,
    // since an entry id could contain characters unsafe to inline raw
    // into a selector string). Chapter links are never "active" — they
    // only carry their own expand/collapse state (aria-expanded).
    Array.prototype.forEach.call(document.querySelectorAll('.bp-toc-link[data-mode="feature"]'), function (a) {
      a.classList.toggle("active", a.getAttribute("data-id") === key);
    });
  }

  function initFullSpec() {
    var toc = buildFullspecToc();

    // TOC click delegation — a feature link renders that one feature; a
    // chapter (system) link ONLY toggles its own expand/collapse state,
    // never renders anything into the content pane.
    document.getElementById("bp-fullspec-toc").addEventListener("click", function (ev) {
      var link = ev.target.closest("[data-mode]");
      if (!link) return;
      var mode = link.getAttribute("data-mode");
      if (mode === "chapter") {
        toggleTocChapter(link);
        return;
      }
      selectFullspec(link.getAttribute("data-id"));
    });

    // Content-pane click/keydown delegation — attached ONCE to the
    // persistent #bp-fullspec-content element; still works after every
    // selectFullspec() innerHTML swap because delegation resolves the
    // target at click time, not at listener-registration time.
    var contentRoot = document.getElementById("bp-fullspec-content");
    contentRoot.addEventListener("click", function (ev) {
      var spLink = ev.target.closest(".bp-superpowers-link");
      if (spLink) {
        openSuperpowersModal(spLink.getAttribute("data-sp-path"), spLink.getAttribute("data-sp-label"));
        return;
      }
      var qaGoto = ev.target.closest("[data-goto-qa]");
      if (qaGoto) {
        scrollAndHighlight(qaGoto.getAttribute("data-goto-qa"));
        return;
      }
      var header = ev.target.closest(".bp-collapsible-header");
      if (header) {
        var body = header.parentElement.querySelector(".bp-collapsible-body");
        var wasHidden = body.hasAttribute("hidden");
        if (wasHidden) { body.removeAttribute("hidden"); } else { body.setAttribute("hidden", ""); }
        header.classList.toggle("bp-collapsible-expanded", wasHidden);
      }
    });
    contentRoot.addEventListener("keydown", function (ev) {
      if (ev.key !== "Enter" && ev.key !== " ") return;
      var header = ev.target.closest(".bp-collapsible-header");
      if (header) { ev.preventDefault(); header.click(); }
    });

    // Narrow-screen TOC collapse (first-glance orientation still holds: the
    // toggle button itself is always visible, see the @media rule in CSS).
    document.getElementById("bp-toc-toggle").addEventListener("click", function () {
      document.getElementById("bp-fullspec").classList.toggle("bp-toc-open");
    });

    // Landing default (D17): the first ACTIVE system's FIRST feature, so a
    // fresh load shows real content with zero clicks — chapters ship
    // expanded already, so the overview is visible in the TOC regardless.
    // Every entry in toc.activeChapters[0] is guaranteed non-empty
    // (buildFullspecToc() already filters out chapters with zero entries).
    if (toc.activeChapters.length > 0 && toc.activeChapters[0].entries.length > 0) {
      selectFullspec(toc.activeChapters[0].entries[0].id);
    } else {
      document.getElementById("bp-fullspec-content").innerHTML = "<p>(尚無條目)</p>";
    }
  }

  document.getElementById("bp-recent-list").addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-goto]");
    if (t) showDetail(t.getAttribute("data-goto"));
  });

  Array.prototype.forEach.call(document.querySelectorAll("#bp-list th[data-key]"), function (th) {
    th.addEventListener("click", function () {
      var key = th.getAttribute("data-key");
      if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1; }
      renderList();
    });
  });

  ["bp-search", "bp-filter-status", "bp-filter-system", "bp-filter-tag"].forEach(function (id) {
    document.getElementById(id).addEventListener("input", renderList);
    document.getElementById(id).addEventListener("change", renderList);
  });

  // Batch3 feature 5 — 廢棄/擱置 header toggles the collapsed section.
  document.getElementById("bp-deprecated-header").addEventListener("click", function () {
    deprecatedExpanded = !deprecatedExpanded;
    renderList();
  });

  // Batch3 feature 2 — modal UX floor: close via X button, click-on-backdrop,
  // or Esc; the modal box itself has cursor:default (see CSS) so only the
  // backdrop area (outside the box) closes on click.
  document.getElementById("bp-modal-close").addEventListener("click", closeSuperpowersModal);
  document.getElementById("bp-modal-backdrop").addEventListener("click", function (ev) {
    if (ev.target === ev.currentTarget) closeSuperpowersModal();
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") closeSuperpowersModal();
  });

  initSplitters();
  renderBanner();
  populateFilterOptions();
  renderStats();
  renderRecent();
  renderList();
  initFullSpec();
  setMode("full");
})();
</script>
</body>
</html>
