<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<title>misakaAssetGene — Blueprint</title>

<style>
  :root {
    --border: #d7dbe0;
    --bg: #ffffff;
    --bg-alt: #f6f7f9;
    --fg: #1f2430;
    --fg-muted: #6b7280;
    --accent: #2563eb;
    --warn: #b45309;
    --fail: #b91c1c;
    --pass: #15803d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", "Noto Sans TC", system-ui, sans-serif;
    color: var(--fg);
    background: var(--bg);
    font-size: 14px;
  }
  #bp-banner {
    background: var(--bg-alt);
    border-bottom: 1px solid var(--border);
    padding: 6px 16px;
    font-size: 12px;
    color: var(--fg-muted);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  #bp-banner b { color: var(--fg); }
  .bp-project-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--fg);
    letter-spacing: .01em;
  }

  /* --------------------------------------------------------------------
   * D15 — top mode toggle (總規格 / 條目清單). First-glance orientation:
   * always visible right under the banner, above whichever mode is shown.
   * -------------------------------------------------------------------- */
  #bp-mode-toggle {
    display: flex;
    gap: 6px;
    padding: 6px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .bp-mode-btn {
    padding: 4px 14px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--bg-alt);
    color: var(--fg-muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .bp-mode-btn:hover { border-color: var(--accent); color: var(--accent); }
  .bp-mode-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  #bp-layout {
    display: flex;
    height: calc(100vh - 68px);
  }
  /* CSS-specificity fix: an ID selector (#bp-layout / #bp-fullspec, both
     setting `display: flex`) beats the browser's default `[hidden] {
     display: none}` UA-stylesheet rule (attribute selector, lower
     specificity) — so setting the `hidden` attribute/property alone does
     NOT actually hide either pane; it silently stays flex-laid-out
     underneath the other mode, bleeding through at the page bottom. These
     explicit `[hidden]` overrides (same specificity as the base rule, but
     declared LATER in the stylesheet, so they win) restore real hiding. */
  #bp-layout[hidden] { display: none; }
  #bp-sidebar {
    width: 420px;
    min-width: 280px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  /* Dual splitters (batch2): vertical between list panel + detail pane,
     horizontal for the "最近 30 天變動" block. Grip texture + hover/drag
     highlight make the affordance visually obvious, not just a cursor. */
  .bp-splitter {
    flex: none;
    background: var(--border);
    position: relative;
    z-index: 2;
  }
  .bp-splitter:hover, .bp-splitter.bp-splitter-dragging {
    background: var(--accent);
  }
  .bp-splitter::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
  }
  .bp-splitter-v {
    width: 6px;
    cursor: col-resize;
  }
  .bp-splitter-v::after {
    width: 2px;
    height: 28px;
    transform: translate(-50%, -50%);
    background-image: repeating-linear-gradient(to bottom, rgba(255,255,255,.85) 0 2px, transparent 2px 4px);
  }
  .bp-splitter-h {
    height: 6px;
    cursor: row-resize;
  }
  .bp-splitter-h::after {
    height: 2px;
    width: 28px;
    transform: translate(-50%, -50%);
    background-image: repeating-linear-gradient(to right, rgba(255,255,255,.85) 0 2px, transparent 2px 4px);
  }
  body.bp-resizing {
    user-select: none;
  }
  #bp-filters {
    padding: 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #bp-filters input, #bp-filters select {
    padding: 4px 6px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
  }
  #bp-filters input { cursor: text; }
  #bp-filters select:hover, #bp-filters input:hover { border-color: var(--accent); }
  #bp-filters select:focus, #bp-filters input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  #bp-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-alt);
    font-size: 12px;
  }
  .bp-stat-chip {
    padding: 2px 8px;
    border-radius: 10px;
    white-space: nowrap;
    font-weight: 600;
    border: 1px solid transparent;
  }
  #bp-recent {
    padding: 8px 10px;
    font-size: 12px;
    height: 120px;
    min-height: 80px;
    overflow-y: auto;
    flex: none;
  }
  #bp-recent h4 { margin: 0 0 4px 0; font-size: 12px; color: var(--fg-muted); }
  #bp-recent ul { margin: 0; padding-left: 16px; }
  #bp-list-wrap { flex: 1; overflow-y: auto; }
  table#bp-list { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table#bp-list th, table#bp-list td {
    padding: 5px 6px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 140px;
  }
  table#bp-list th {
    position: sticky;
    top: 0;
    background: var(--bg-alt);
    cursor: pointer;
    user-select: none;
  }
  /* Cursor-defect fix (batch2): every descendant of a clickable row must
     show pointer — badges/spans inside a td were inheriting cursor:default
     from the rule above (now removed), making the 狀態 column feel dead. */
  #bp-list tbody tr, #bp-list tbody tr * {
    cursor: pointer;
  }
  table#bp-list th:hover { background: #e8ebf5; color: var(--accent); }
  table#bp-list th:active { background: #dde2f2; }
  table#bp-list th .bp-sort-arrow { margin-left: 3px; color: var(--accent); font-size: 10px; }
  table#bp-list tr.bp-row { cursor: pointer; }
  table#bp-list tr.bp-row:hover { background: #f0f4ff; }
  table#bp-list tr.bp-row:active { background: #dbe3fb; }
  table#bp-list tr.bp-row.active {
    background: #dde7ff;
    border-left: 3px solid var(--accent);
    font-weight: 600;
    box-shadow: inset 0 0 0 1px #c3d3fb;
  }
  table#bp-list tr.bp-row.active td:first-child { padding-left: 3px; }
  /* Row-expand toggle (batch2): column widths (max-width above) stay
     untouched — only wrap mode flips, so the row grows taller in place. */
  table#bp-list tr.bp-row.bp-row-expanded td {
    white-space: normal;
    overflow: visible;
    text-overflow: unset;
  }
  .bp-expand-indicator {
    display: inline-block;
    margin-right: 3px;
    font-size: 9px;
    color: var(--fg-muted);
    transition: transform .15s ease;
  }
  table#bp-list tr.bp-row.bp-row-expanded .bp-expand-indicator {
    transform: rotate(90deg);
  }
  .bp-badge {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
    border: 1px solid transparent;
  }

  /* --------------------------------------------------------------------
   * D15 — list-mode title-first columns: title is the primary, larger/
   * bolder column a user reads first; the BP id is demoted to small muted
   * text beside it. Column ORDER is swapped (title th/td before id th/td)
   * so it is literally the first text read, while both stay independently
   * sortable via their own data-key <th>.
   * -------------------------------------------------------------------- */
  .bp-col-title { font-weight: 700; font-size: 13px; }
  .bp-col-id { color: var(--fg-muted); font-size: 10.5px; }

  /* --------------------------------------------------------------------
   * Ten fixed, distinct status colors (SPEC §5.2 UX floor, P1 gate) —
   * used consistently for list badges (.bp-badge), stats chips
   * (.bp-stat-chip), and the detail-header badge. Slug naming is a
   * stable English mapping of the zh-TW status enum (SPEC §4.2):
   *   待評估→eval-pending  評估中→eval-progress  待判斷→decision
   *   待做→todo  開發中→in-dev  已完成→done  已測試→tested
   *   已部署→deployed  廢棄→deprecated  擱置→shelved
   * -------------------------------------------------------------------- */
  .bp-status-eval-pending  { background: #eceff1; color: #455a64; border-color: #cfd8dc; }
  .bp-status-eval-progress { background: #cfd8dc; color: #263238; border-color: #b0bec5; }
  .bp-status-decision      { background: #fff3cd; color: #92650a; border-color: #f5d78e; }
  .bp-status-todo          { background: #dbeafe; color: #1d4ed8; border-color: #bfdbfe; }
  .bp-status-in-dev        { background: #ede9fe; color: #6d28d9; border-color: #ddd6fe; }
  .bp-status-done          { background: #dcfce7; color: #15803d; border-color: #bbf7d0; }
  .bp-status-tested        { background: #ccfbf1; color: #0f766e; border-color: #99f6e4; }
  .bp-status-deployed      { background: #a5f3fc; color: #0e7490; border-color: #67e8f9; }
  .bp-status-deprecated    { background: #fee2e2; color: #b91c1c; border-color: #fecaca; text-decoration: line-through; }
  .bp-status-shelved       { background: #efe0d0; color: #7c5a3a; border-color: #e3cba9; }
  .bp-badge-default, .bp-stat-chip.bp-badge-default { background: #e5e7eb; color: var(--fg-muted); }

  #bp-detail { flex: 1; overflow-y: auto; padding: 20px 28px; }
  #bp-detail.empty { color: var(--fg-muted); }
  #bp-detail h1 { margin-top: 0; font-size: 20px; }
  #bp-detail img { max-width: 100%; }
  #bp-detail table { border-collapse: collapse; width: 100%; margin: 8px 0; }
  #bp-detail table th, #bp-detail table td {
    border: 1px solid var(--border);
    padding: 4px 8px;
    font-size: 13px;
    text-align: left;
  }
  #bp-detail pre, #bp-detail code { background: var(--bg-alt); }
  #bp-detail pre.mermaid { text-align: center; overflow: auto; }
  #bp-detail pre.mermaid.bp-mermaid-rendered { background: none; border: none; padding: 4px 0; }
  #bp-detail pre.mermaid.bp-mermaid-rendered svg { max-width: 100%; }
  .bp-section-title {
    margin: 18px 0 6px 0;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--fg-muted);
    border-bottom: 1px solid var(--border);
    padding-bottom: 4px;
  }
  .bp-result-pass { color: var(--pass); font-weight: 600; }
  .bp-result-fail { color: var(--fail); font-weight: 600; }
  a.bp-dep-link { color: var(--accent); cursor: pointer; text-decoration: underline; }
  a.bp-dep-link:hover { color: #1e40af; text-decoration: none; }
  a.bp-dep-link:active { color: #1e3a8a; }
  /* Audit (batch2): dep-link / recent-list / detail-pane data-goto elements
     never nest child markup today, but guard their descendants too so a
     future nested <span> can never regress into a dead-feeling cursor. */
  a.bp-dep-link * { cursor: pointer; }

  /* --------------------------------------------------------------------
   * Batch3 feature 1/2 — superpowers link list + embedded doc-viewer modal
   * -------------------------------------------------------------------- */
  .bp-superpowers-list { margin: 4px 0 0 0; padding-left: 18px; }
  a.bp-superpowers-link { color: var(--accent); cursor: pointer; text-decoration: underline; font-weight: 600; }
  a.bp-superpowers-link:hover { color: #1e40af; text-decoration: none; }
  a.bp-superpowers-link:active { color: #1e3a8a; }
  a.bp-superpowers-link * { cursor: pointer; }
  .bp-modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 20, 30, .55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    cursor: pointer;
  }
  .bp-modal-backdrop[hidden] { display: none; }
  .bp-modal {
    background: var(--bg);
    border-radius: 8px;
    width: 90%;
    max-width: 900px;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    cursor: default;
    box-shadow: 0 12px 40px rgba(0,0,0,.3);
  }
  .bp-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    font-weight: 700;
    cursor: default;
  }
  .bp-modal-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bp-modal-close {
    border: none;
    background: none;
    font-size: 22px;
    line-height: 1;
    color: var(--fg-muted);
    cursor: pointer;
    padding: 0 4px;
  }
  .bp-modal-close:hover { color: var(--fail); }
  .bp-modal-body {
    padding: 16px 20px;
    overflow-y: auto;
    overflow-x: hidden;
    cursor: text;
  }
  .bp-modal-body img { max-width: 100%; }
  .bp-modal-body pre, .bp-modal-body code { background: var(--bg-alt); }

  /* --------------------------------------------------------------------
   * Batch3 feature 3 — qa_log anchor scroll + highlight
   * -------------------------------------------------------------------- */
  @keyframes bp-highlight-fade {
    0% { background: #fff59d; }
    100% { background: transparent; }
  }
  .bp-highlight { animation: bp-highlight-fade 1.6s ease-out; }

  /* --------------------------------------------------------------------
   * Batch3 feature 4 — 歷程 timeline
   * -------------------------------------------------------------------- */
  ul.bp-timeline { list-style: none; margin: 0; padding: 0; }
  ul.bp-timeline li {
    padding: 4px 0;
    border-bottom: 1px dashed var(--border);
    font-size: 13px;
  }
  ul.bp-timeline li[data-goto-qa] { cursor: pointer; }
  ul.bp-timeline li[data-goto-qa]:hover { background: #f0f4ff; }
  .bp-timeline-date { font-weight: 600; color: var(--fg-muted); margin-right: 8px; }
  .bp-timeline-kind {
    display: inline-block;
    padding: 0 6px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 600;
    margin-right: 6px;
    background: var(--bg-alt);
    color: var(--fg-muted);
    border: 1px solid var(--border);
  }
  .bp-timeline-undated { color: var(--warn); font-weight: 700; }

  /* --------------------------------------------------------------------
   * Batch3 feature 5 — 廢棄/擱置 segregated, collapsed section
   * -------------------------------------------------------------------- */
  .bp-deprecated-header {
    padding: 6px 10px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--fg-muted);
    background: var(--bg-alt);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
  }
  .bp-deprecated-header:hover { color: var(--accent); }
  .bp-deprecated-header .bp-expand-indicator { transition: transform .15s ease; }
  .bp-deprecated-header.bp-deprecated-expanded .bp-expand-indicator { transform: rotate(90deg); }
  table#bp-deprecated-list { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table#bp-deprecated-list th, table#bp-deprecated-list td {
    padding: 5px 6px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 140px;
  }
  #bp-deprecated-list tbody tr, #bp-deprecated-list tbody tr * { cursor: pointer; }
  table#bp-deprecated-list tr.bp-row:hover { background: #f0f4ff; }
  table#bp-deprecated-list tr.bp-row.active {
    background: #dde7ff;
    border-left: 3px solid var(--accent);
    font-weight: 600;
  }

  /* ======================================================================
   * D15 — 總規格 reading view (default view on load)
   * ==================================================================== */
  #bp-fullspec {
    display: flex;
    height: calc(100vh - 68px);
    position: relative;
  }
  /* Same CSS-specificity fix as #bp-layout[hidden] above — needed for the
     reverse direction (list mode active, 總規格 hidden). */
  #bp-fullspec[hidden] { display: none; }
  #bp-fullspec-toc {
    width: 280px;
    min-width: 220px;
    flex: none;
    overflow-y: auto;
    border-right: 1px solid var(--border);
    background: var(--bg-alt);
    padding: 12px 10px;
    position: sticky;
    top: 0;
  }
  ul.bp-toc, ul.bp-toc ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  ul.bp-toc ul { padding-left: 12px; margin-top: 2px; margin-bottom: 8px; }
  ul.bp-toc ul[hidden] { display: none; }
  a.bp-toc-link {
    display: block;
    padding: 3px 6px;
    border-radius: 4px;
    color: var(--fg);
    text-decoration: none;
    font-size: 12.5px;
    cursor: pointer;
  }
  a.bp-toc-link * { cursor: pointer; }
  a.bp-toc-link:hover { background: #e8ebf5; color: var(--accent); }
  a.bp-toc-link.active { background: var(--accent); color: #fff; font-weight: 600; }
  a.bp-toc-chapter-link { font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .02em; }
  a.bp-toc-chapter-link .bp-toc-caret { display: inline-block; width: 12px; margin-right: 2px; font-size: 10px; }
  #bp-fullspec-content {
    flex: 1;
    overflow-y: auto;
    padding: 20px 32px;
  }
  #bp-toc-toggle {
    display: none;
    position: absolute;
    top: 8px;
    left: 8px;
    z-index: 5;
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--bg);
    color: var(--fg);
    font-size: 12px;
    cursor: pointer;
  }
  .bp-fullspec-feature {
    padding: 14px 0 20px 0;
    border-bottom: 1px dashed var(--border);
  }
  .bp-fullspec-feature:last-child { border-bottom: none; }
  .bp-fullspec-muted { opacity: .7; }
  .bp-fullspec-feature-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .bp-fullspec-feature-title { margin: 0; font-size: 19px; font-weight: 700; }
  .bp-fullspec-feature-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--fg-muted);
  }
  .bp-fullspec-id { font-size: 11px; color: var(--fg-muted); margin: 2px 0 10px 0; }
  .bp-fullspec-deprecated-note { color: var(--fail); font-size: 13px; }
  .bp-fullspec-body img { max-width: 100%; }
  .bp-fullspec-body table { border-collapse: collapse; width: 100%; margin: 8px 0; }
  .bp-fullspec-body table th, .bp-fullspec-body table td {
    border: 1px solid var(--border);
    padding: 4px 8px;
    font-size: 13px;
    text-align: left;
  }
  .bp-fullspec-body pre, .bp-fullspec-body code { background: var(--bg-alt); }
  .bp-fullspec-body pre.mermaid { text-align: center; overflow: auto; }
  .bp-fullspec-body pre.mermaid.bp-mermaid-rendered { background: none; border: none; padding: 4px 0; }
  .bp-fullspec-body pre.mermaid.bp-mermaid-rendered svg { max-width: 100%; }

  /* Collapsible 討論記錄/測試記錄/歷程 blocks — collapsed by default. */
  .bp-collapsible { margin-top: 10px; border: 1px solid var(--border); border-radius: 6px; }
  .bp-collapsible-header {
    padding: 6px 10px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--fg-muted);
    background: var(--bg-alt);
    cursor: pointer;
    user-select: none;
  }
  .bp-collapsible-header:hover { color: var(--accent); }
  .bp-collapsible-header .bp-expand-indicator { transition: transform .15s ease; }
  .bp-collapsible-header.bp-collapsible-expanded .bp-expand-indicator { transform: rotate(90deg); }
  .bp-collapsible-body { padding: 10px; }
  .bp-collapsible-body[hidden] { display: none; }

  @media (max-width: 900px) {
    #bp-fullspec-toc {
      position: fixed;
      top: 68px;
      left: 0;
      bottom: 0;
      z-index: 4;
      transform: translateX(-100%);
      transition: transform .2s ease;
      box-shadow: 2px 0 10px rgba(0,0,0,.15);
    }
    #bp-fullspec.bp-toc-open #bp-fullspec-toc { transform: translateX(0); }
    #bp-toc-toggle { display: inline-block; }
    /* Make room for the fixed toggle button so it never overlaps the first
       line of feature-section text at narrow widths. */
    #bp-fullspec-content { padding-top: 46px; }
  }
</style>
</head>
<body>

<div id="bp-banner"></div>

<div id="bp-mode-toggle">
  <button type="button" class="bp-mode-btn active" id="bp-mode-full" data-mode="full">總規格</button>
  <button type="button" class="bp-mode-btn" id="bp-mode-list" data-mode="list">條目清單</button>
</div>

<div id="bp-fullspec">
  <button type="button" id="bp-toc-toggle" aria-label="目錄">☰ 目錄</button>
  <nav id="bp-fullspec-toc"></nav>
  <div id="bp-fullspec-content"></div>
</div>

<div id="bp-layout" hidden>
  <div id="bp-sidebar">
    <div id="bp-filters">
      <input id="bp-search" type="text" placeholder="全文搜尋(標題/本文/id)..." />
      <div style="display:flex; gap:6px;">
        <select id="bp-filter-status" style="flex:1"><option value="">狀態(全部)</option></select>
        <select id="bp-filter-system" style="flex:1"><option value="">系統(全部)</option></select>
      </div>
      <select id="bp-filter-tag"><option value="">標籤(全部)</option></select>
    </div>
    <div id="bp-stats"></div>
    <div id="bp-recent">
      <h4>最近 30 天變動</h4>
      <ul id="bp-recent-list"></ul>
    </div>
    <div id="bp-splitter-h" class="bp-splitter bp-splitter-h" title="拖曳調整高度(雙擊還原)"></div>
    <div id="bp-list-wrap">
      <table id="bp-list">
        <thead>
          <tr>
            <th data-key="title">標題</th>

ift），本次以程式碼實況為準", "body": "\n## 設計說明\n\n`project_id` 若沒有白名單限制，理論上可以塞入 `../../etc/passwd` 之類的路徑穿越 payload，讓後端在 `projects_root` 之外讀寫檔案。修法是在唯一的防禦漏斗（`validate_project_id()`）強制 `^[a-z0-9_-]+$` 格式，路由層依賴注入與 body 帶入的 id（`select_project`/`clarify`/`sessions` 等）全部收斂到同一個函式檢查。\n\n### 現況核對（2026-07-23 盤點，重要發現）\n\n**與 @PM 登記不一致，本次以程式碼為準：** `@PM/projects/misakaAssetGene.md`「剩餘 deferred tails」目前仍列著「get_project project_id 路徑驗證 — 路徑驗證不足，可能逃出 project root」為未解決項，但實際程式碼（`core/project/manager.py:23-36` `validate_project_id()`，`core/project/manager.py:120` `get_project()` 開頭即呼叫）顯示此問題**已於 2026-06-20（commit 062eb13）修復**，並有專屬測試檔 `tests/test_project_id_validation.py` 覆蓋。這是登記漂移（該修復發生在 @PM roadmap 最後一次更新之後，未回寫登記），非本次盤點誤判——已請使用者核對 @PM 登記是否需要同步更新。\n", "latest_test_date": null, "latest_test_result": null, "last_revision_date": "2026-06-20"}, {"id": "BP-SETUP-1", "title": "Setup 體驗（uv-bootstrap + 階段化進度 + 友善錯誤 + AI 診斷）", "system": "setup", "tags": ["setup", "uv", "error-handling", "ai-explain"], "status": "已完成", "request_verbatim": "Setup 友善錯誤處理｜階段化進度、已知錯誤白名單 + 友善訊息、未知錯誤可 AI 解釋（spec.md §2 Feature Matrix，P0；§11.1~§11.4）（@PM 登記 M4.e，2026-06-13）", "decided_date": "2026-06-13", "feasibility": null, "user_verdict": null, "depends_on": [], "reverse_deps": [], "exec_links": ["scripts/setup.ps1", "scripts/setup.sh", "scripts/doctor.py"], "done_date": "2026-06-13", "deploy_status": null, "tests": [], "deprecated": null, "revisions": [], "qa_log": [], "superpowers": [{"path": "docs/superpowers/specs/spec.md", "label": "spec.md §11.1 入口 / §11.2 階段化進度 UI / §11.3 友善錯誤處理 / §11.4 原則"}], "origin": "M4.e commit b9e0d5f（2026-06-13）『feat(setup): uv-bootstrap + setup.log + known-error whitelist + setup-error AI explanation (M4.e; Tauri bundler deferred)』，303 tests passed，reviewer 確認無 API key 洩漏（對抗式探測 + 4 項安全測試）", "body": "\n## 設計說明\n\nSetup 不假設使用者已裝好 Python（改用 uv 自舉，7 個階段），全程寫 `setup.log`；遇到已知的 7 類常見錯誤（缺依賴、port 占用等）用白名單比對給出友善訊息，遇到白名單外的未知錯誤則呼叫 LLM Router（Ollama→Anthropic→OpenAI→Gemini，注入式 client）產生 AI 解釋，且任何寫入 log/console 前都先做 API key 脫敏。\n\n### 現況核對（2026-07-23 盤點）\n\n@PM 登記 303 tests passed，reviewer 對 API key 脫敏做了「adversarial probe」（對抗式探測，故意嘗試讓 key 洩漏）+ 4 項專屬安全測試，確認無洩漏。同一 commit 訊息明確標注「Tauri bundler deferred」——即這次一起決策把 Tauri 跨平台打包留到之後（見 `BP-SETUP-2`）。\n", "latest_test_date": null, "latest_test_result": null, "last_revision_date": "2026-06-13"}, {"id": "BP-SETUP-2", "title": "Tauri 跨平台打包（.msi / .dmg / .AppImage）", "system": "setup", "tags": ["setup", "tauri", "bundler", "packaging", "deferred"], "status": "待判斷", "request_verbatim": "Tauri bundler — .msi/.dmg/.AppImage 跨平台打包待使用者決定時程（M4.e deferred；@PM「剩餘 deferred tails」）", "decided_date": "2026-06-13", "feasibility": null, "user_verdict": null, "depends_on": [], "reverse_deps": [], "exec_links": ["src-tauri/tauri.conf.json"], "done_date": null, "deploy_status": null, "tests": [], "deprecated": null, "revisions": [], "qa_log": [], "superpowers": [{"path": "docs/superpowers/specs/spec.md", "label": "spec.md §1.4 分發模式"}], "origin": null, "body": "\n## 設計說明\n\nspec §1.4「分發模式」預期最終以 Tauri 打包成 `.msi`（Windows）/`.dmg`（macOS）/`.AppImage`（Linux）供終端使用者安裝，而非要求使用者自己跑 `npm run start:dev`。M4.e 決策時，使用者明確選擇「Portable → testable core only（先求核心可測可跑），Tauri 跨平台打包器留到之後」——即這是使用者主動決定延後時程，而非開發卡關。\n\n### 現況核對（2026-07-23 盤點）\n\n`src-tauri/tauri.conf.json` 目前只有基本的 `app.windows`（視窗標題/尺寸）設定，**沒有** `bundle` 區塊（Tauri 打包需要的 `bundle.targets`/icon/installer 設定完全不存在）。狀態判定為「待判斷」而非「待做」——因為這不是遺漏，而是使用者已明確表態「時程待我決定」，下一步是等使用者排定時程，不是逕自排入開發佇列。\n", "latest_test_date": null, "latest_test_result": null, "last_revision_date": "2026-06-13"}, {"id": "BP-STYLE-1", "title": "初始 Style Guide 生成（專案建立時）", "system": "style", "tags": ["style-guide", "project-init", "template"], "status": "已完成", "request_verbatim": "風格指南｜專案級 style guide（色票、關鍵字、IP-Adapter 錨定圖、自訓 LoRA）（spec.md §2 Feature Matrix，P1；§5.3 風格一致性）", "decided_date": "2026-05-07", "feasibility": null, "user_verdict": null, "depends_on": [], "reverse_deps": [], "exec_links": ["core/project/style_guide.py"], "done_date": "2026-05-07", "deploy_status": null, "tests": [], "deprecated": null, "revisions": [], "qa_log": [], "superpowers": [{"path": "docs/superpowers/specs/spec.md", "label": "spec.md §5.3 風格一致性 (Consistency)"}], "origin": "M1 commit ca99f10（2026-05-07）隨專案建立流程一併引入", "body": "\n## 設計說明\n\nspec §5.3 定義風格鎖定三層強度（L1 文字描述 → L2 IP-Adapter 錨定圖 → L3 自訓 LoRA），style_guide.md 是人類可讀 Markdown，生成前整份塞進 system prompt（不靠 RAG 檢索片段，確保一致性）。專案建立時，`build_initial_style_guide()` 依專案的 name/type/synopsis 產生初版 style_guide.md 骨架。\n\n### 現況核對（2026-07-23 盤點）\n\n`core/project/style_guide.py`（16 行）目前**僅**提供最初版骨架生成（Project/Type/Synopsis 三個欄位的模板字串），不包含色票/關鍵字/IP-Adapter 錨定圖/自訓 LoRA 等 spec 範例展示的完整欄位——這些欄位預期是使用者後續手動編輯或由「自動 Style Guide Propose」（`BP-STYLE-2`，待做）產生建議後寫入。本條目狀態「已完成」僅指「建專案時自動產生一份可編輯的初版 style_guide.md」這個較小範圍的功能。\n", "latest_test_date": null, "latest_test_result": null, "last_revision_date": "2026-05-07"}, {"id": "BP-STYLE-2", "title": "自動 Style Guide Propose（雙重門檻建議卡片）", "system": "style", "tags": ["style-guide", "auto-propose", "llm-confidence", "deferred"], "status": "待做", "request_verbatim": "自動 Style Guide Propose｜雙重門檻（啟發式 + LLM 置信度）+ 自適應調整（spec.md §2 Feature Matrix，P1；§5.4 自動 Style Guide Propose）", "decided_date": "2026-05-07", "feasibility": null, "user_verdict": null, "depends_on": [], "reverse_deps": [], "exec_links": ["core/project/style_guide.py"], "done_date": null, "deploy_status": null, "tests": [], "deprecated": null, "revisions": [], "qa_log": [], "superpowers": [{"path": "docs/superpowers/specs/spec.md", "label": "spec.md §5.4 自動 Style Guide Propose"}], "origin": null, "body": "\n## 設計說明\n\nspec §5.4 描述一套相當完整的自動建議機制：啟發式硬條件（≥3 個 accepted 素材 + ≥2 個 tag 重疊 + 距上次提議 ≥1 天）AND LLM 自評置信度（0–100，預設門檻 ≥75）雙重把關，觸發後在對話中出現「建議更新 style_guide.md」卡片，使用者可 Accept/Edit/Reject，Accept 可一鍵 undo；門檻依使用者 accept/reject 歷史自適應調整（±2，範圍 60–90，連續才累積、單次交錯歸零）。\n\n### 現況核對（2026-07-23 盤點，重要發現）\n\n全 repo 搜尋 `confidence`+`style`、`has_pattern`、`pattern_summary`、`propose`+`style` 等 spec §5.4 描述的關鍵字/欄位名稱，**沒有任何程式碼命中**（`core/project/style_gui nspec §7.3 要求前端能即時看到訓練進度。原始設計是 GET 輪詢（`GET /api/v1/projects/{id}/training/{job_id}`），2026-06-20 追加 Server-Sent Events 推送端點（`GET /api/v1/projects/{id}/training/{job_id}/stream`），executor 把增量狀態（status/progress/label 變化）持久化後由此端點逐幀推送 `event: progress`，終態送 `event: done`，前端改用 `EventSource` 訂閱取代輪詢。\n\n### 現況核對（2026-07-23 盤點）\n\n**重要發現（與 @PM 登記不一致，本次以程式碼為準）：** `@PM/projects/misakaAssetGene.md`「剩餘 deferred tails」仍列著「訓練進度串流 — 目前用 GET 輪詢；改為 SSE/WS 推送（M4.d deferred）」，但實際程式碼（`core/main.py:857` `stream_training_job`、`core/training/service.py` `stream_job_progress`、前端 `frontend/src/api/client.ts:565` `trainingJobStreamUrl` + `frontend/src/stores/app.ts:483` 的 `EventSource` 訂閱）顯示 SSE 推送**已經前後端雙向落地**，並有 `tests/test_training_stream.py` 契約測試。這是 2026-06-20 的後續提交（a0ec366），晚於 @PM 登記更新的時間點，屬**登記漂移（registry drift）**，非本次盤點誤判。程式碼內建的 docstring 誠實自陳：「REAL-RUN NOTE: the push path is contract/unit-tested with a fake job store... End-to-end verification against a live kohya_ss / GPT-SoVITS GPU training run is DEFERRED to the user.」——即推送機制本身已完成，但仍待真實 GPU 訓練跑一輪來驗證端到端（見 `BP-TRAIN-6`）。\n", "latest_test_date": null, "latest_test_result": null, "last_revision_date": "2026-06-20"}, {"id": "BP-TRAIN-5", "title": "§7.3 Resume-from-checkpoint", "system": "train", "tags": ["training", "resume", "checkpoint", "deferred"], "status": "待做", "request_verbatim": "§7.3 resume-from-checkpoint — resume_checkpoint_path 已預留槽位，實作未做（M4.d deferred；@PM「剩餘 deferred tails」）", "decided_date": "2026-06-13", "feasibility": null, "user_verdict": null, "depends_on": [], "reverse_deps": [], "exec_links": ["core/models/schemas.py", "core/training/executor.py"], "done_date": null, "deploy_status": null, "tests": [], "deprecated": null, "revisions": [], "qa_log": [], "superpowers": [{"path": "docs/superpowers/specs/spec.md", "label": "spec.md §7.3 訓練狀態回報"}], "origin": null, "body": "\n## 設計說明\n\n訓練任務若中途中斷，理想上應該能從最後一個 checkpoint 續跑，而不必整個重來。M4.d 決策先把資料結構的欄位（`resume_checkpoint_path`）預留出來，但續跑邏輯本身沒有實作。\n\n### 現況核對（2026-07-23 盤點）\n\n`core
